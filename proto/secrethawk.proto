syntax = "proto3";

package secrethawk.v1;

option go_package = "github.com/hacrrrrrrr/SecretHawk/proto/secrethawk/v1";

message ScanRequest {
  string path = 1;
  string format = 2;
}

message Finding {
  string detector = 1;
  string severity = 2;
  uint32 confidence = 3;
  string path = 4;
  uint32 line = 5;
  string redacted_match = 6;
}

message ScanResponse {
  repeated Finding findings = 1;
}

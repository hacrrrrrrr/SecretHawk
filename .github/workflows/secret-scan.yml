name: SecretHawk Scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Build SecretHawk
        run: go build -trimpath -o /tmp/secrethawk ./cmd/secrethawk
      - name: Scan repository
        run: /tmp/secrethawk scan . --format sarif --fail-on-secret > /tmp/secrethawk.sarif
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: /tmp/secrethawk.sarif
